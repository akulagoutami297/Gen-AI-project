services:
  - type: web
    name: notebot-backend
    env: python
    root: backend
    plan: free
    region: oregon
    buildCommand: "pip install --upgrade pip setuptools wheel && pip install -r requirements.txt"
    startCommand: "gunicorn run:app --bind 0.0.0.0:$PORT --workers 1 --threads 2"
    envVars:
      - key: SECRET_KEY
        scope: env
      - key: FRONTEND_URL
        scope: env
      - key: LOG_LEVEL
        scope: env
      - key: FLASK_DEBUG
        scope: env
